name = "script-whitelist"
main = "src/worker/index.js"
compatibility_date = "2026-11-22"
workers_dev = true

[vars]
SCRIPT_SOURCE_URL = "https://raw.githubusercontent.com/nyxv4/nyx1/main/downloader.lua"

[[kv_namespaces]]
binding = "KEYS"
id = "9dfa9591ff43438e962074c9329f4575"
preview_id = "9dfa9591ff43438e962074c9329f4575"

[[ratelimits]]
name = "GETSCRIPT_RATE_LIMITER"
# Pick an integer unique to your Cloudflare account for each rate limit binding.
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60

[secrets]
required = ["BOT_SECRET"]
