name = "script-whitelist"
main = "worker.js"
compatibility_date = "2024-09-25"

# Create the KV namespace first:
#   wrangler kv namespace create KEYS
# then paste the returned id below.
[[kv_namespaces]]
binding = "KEYS"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# Non-secret config:
[vars]
SCRIPT_URL = "https://raw.githubusercontent.com/nyxv4/nyx1/main/downloader.lua"

# Secrets (wrangler secret put):
#   BOT_SECRET  = shared password between bot and worker
